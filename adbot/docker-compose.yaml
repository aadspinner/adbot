
version: "3.9"

services:
  backend:
    container_name: clean-backend-v3  # <-- ✅ Rename it here
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - .env
